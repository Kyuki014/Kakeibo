<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f0;--bg3:#eeede8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#0F6E56;
  --red:#D85A30;--red-bg:#FAECE7;--red-text:#993C1D;
  --radius:12px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f5f5f5;--text2:#aaa;--text3:#777;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --green-bg:#0a3d2b;--green-text:#5DCAA5;
    --red-bg:#3d1a10;--red-text:#F0997B;
  }
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}
.topbar{padding:env(safe-area-inset-top,20px) 16px 12px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:20px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--text3);margin-top:2px}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:var(--bg);border-top:0.5px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.nav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);padding:8px 0;font-family:inherit}
.nav button.active{color:var(--green)}
.nav button i{font-size:24px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--bg2);border-radius:var(--radius-sm);padding:14px}
.metric .lbl{font-size:12px;color:var(--text2);margin-bottom:6px}
.metric .val{font-size:24px;font-weight:600}
.metric .val.income{color:var(--green)}
.metric .val.expense{color:var(--red)}
.balance-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.balance-card .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pbar{background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width .4s}
.pct-lbl{font-size:11px;color:var(--text3);margin-top:5px}
.section-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.item:last-child{border-bottom:none}
.item-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-info .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info .date{font-size:12px;color:var(--text3)}
.item-amount{font-size:15px;font-weight:600;white-space:nowrap}
.del-btn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
.empty{text-align:center;padding:32px 0;color:var(--text3);font-size:14px}
.toggle-row{display:flex;background:var(--bg2);border-radius:var(--radius-sm);padding:4px;gap:4px;margin-bottom:18px}
.toggle-btn{flex:1;padding:10px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);font-family:inherit;transition:all .2s}
.toggle-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-group{margin-bottom:16px}
.form-group label{font-size:13px;color:var(--text2);display:block;margin-bottom:6px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.15)}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;cursor:pointer;font-size:16px;font-weight:600;font-family:inherit;margin-top:8px}
.btn-secondary{width:100%;padding:13px;border-radius:var(--radius-sm);background:none;color:var(--text2);border:0.5px solid var(--border2);cursor:pointer;font-size:15px;margin-top:8px;font-family:inherit}
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.month-nav button{background:none;border:0.5px solid var(--border2);border-radius:99px;padding:4px 14px;cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit}
.month-nav .month-lbl{flex:1;text-align:center;font-size:15px;font-weight:600}
.chart-label{font-size:13px;font-weight:500;color:var(--text2);margin:16px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 18px;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* sync bar */
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:0.5px solid var(--border);font-size:12px;color:var(--text2);flex-shrink:0}
.sync-bar i{font-size:16px}
.sync-status{flex:1}
.sync-btn{background:none;border:0.5px solid var(--border2);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit;white-space:nowrap}
.sync-btn:disabled{opacity:.5;cursor:not-allowed}

/* login screen */
#s-login{align-items:center;justify-content:center;gap:20px;padding:40px 24px;text-align:center}
#s-login h1{font-size:28px;font-weight:700}
#s-login p{font-size:14px;color:var(--text2);line-height:1.7}
.google-btn{display:flex;align-items:center;gap:10px;padding:13px 24px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);cursor:pointer;font-size:15px;font-weight:500;font-family:inherit;color:var(--text)}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div class="screen" id="s-login">
  <div style="font-size:48px">📒</div>
  <h1>家計簿</h1>
  <p>Googleアカウントでログインすると<br>データがスプレッドシートに自動保存されます</p>
  <button class="google-btn" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-21 0-1.3-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.2 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 16.3 2 9.7 6.4 6.3 14.7z"/><path fill="#FBBC05" d="M24 46c5.5 0 10.5-1.8 14.4-5l-6.7-5.5C29.7 37 27 38 24 38c-5 0-9.3-3-10.9-7.4l-7 5.4C9.6 41.6 16.3 46 24 46z"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.9 2.6-2.6 4.7-4.9 6.1l6.7 5.5C42 36.7 45 30.9 45 24c0-1.3-.2-2.7-.5-4z"/></svg>
    Googleでログイン
  </button>
  <p style="font-size:11px;color:var(--text3)">データはあなたのGoogleドライブのスプレッドシートに保存されます</p>
</div>

<!-- HOME -->
<div class="screen" id="s-home">
  <div class="topbar">
    <div class="topbar-row">
      <h1>家計簿</h1>
      <button style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);font-family:inherit" onclick="signOut()">ログアウト</button>
    </div>
  </div>
  <div class="sync-bar">
    <i class="ti ti-cloud"></i>
    <span class="sync-status" id="sync-status">同期中...</span>
    <button class="sync-btn" id="sync-btn" onclick="syncAll()" disabled>同期</button>
  </div>
  <div class="content">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹ 前月</button>
      <div class="month-lbl" id="home-month-lbl"></div>
      <button onclick="changeMonth(1)">翌月 ›</button>
    </div>
    <div class="metric-row">
      <div class="metric"><div class="lbl">収入</div><div class="val income" id="h-income">¥0</div></div>
      <div class="metric"><div class="lbl">支出</div><div class="val expense" id="h-expense">¥0</div></div>
    </div>
    <div class="balance-card">
      <div class="row"><span style="font-size:14px;color:var(--text2)">残高</span><span style="font-size:26px;font-weight:700" id="h-balance">¥0</span></div>
      <div class="pbar"><div class="pfill" id="h-pfill" style="width:0%"></div></div>
      <div class="pct-lbl" id="h-pct-lbl">収入に対する支出: 0%</div>
    </div>
    <div class="section-title">取引一覧</div>
    <div id="home-list"></div>
  </div>
  <nav class="nav">
    <button class="active" onclick="goTo('home')"><i class="ti ti-home"></i>ホーム</button>
    <button onclick="goTo('add')"><i class="ti ti-plus"></i>入力</button>
    <button onclick="goTo('chart')"><i class="ti ti-chart-bar"></i>グラフ</button>
  </nav>
</div>

<!-- ADD -->
<div class="screen" id="s-add">
  <div class="topbar"><h1>記録する</h1></div>
  <div class="content">
    <div class="toggle-row">
      <button class="toggle-btn active" id="type-expense" onclick="setType('expense')">支出</button>
      <button class="toggle-btn" id="type-income" onclick="setType('income')">収入</button>
    </div>
    <div class="form-group"><label>金額（円）</label><input type="number" id="inp-amount" placeholder="0" inputmode="decimal"></div>
    <div class="form-group"><label>カテゴリ</label><select id="inp-cat"></select></div>
    <div class="form-group"><label>メモ（任意）</label><input type="text" id="inp-memo" placeholder="例: スーパーで購入"></div>
    <div class="form-group"><label>日付</label><input type="date" id="inp-date"></div>
    <button class="btn-primary" onclick="addRecord()">保存する</button>
    <button class="btn-secondary" onclick="goTo('home')">キャンセル</button>
  </div>
  <nav class="nav">
    <button onclick="goTo('home')"><i class="ti ti-home"></i>ホーム</button>
    <button class="active"><i class="ti ti-plus"></i>入力</button>
    <button onclick="goTo('chart')"><i class="ti ti-chart-bar"></i>グラフ</button>
  </nav>
</div>

<!-- CHART -->
<div class="screen" id="s-chart">
  <div class="topbar"><h1>グラフ</h1><div class="sub" id="chart-month-lbl"></div></div>
  <div class="content">
    <div class="chart-label">カテゴリ別支出</div>
    <div style="position:relative;width:100%;height:200px"><canvas id="pie-chart" role="img" aria-label="カテゴリ別支出の円グラフ">カテゴリ別支出内訳</canvas></div>
    <div class="legend" id="pie-legend"></div>
    <div class="chart-label">月別収支（過去6ヶ月）</div>
    <div style="position:relative;width:100%;height:180px"><canvas id="bar-chart" role="img" aria-label="月別収支棒グラフ">月別収支推移</canvas></div>
    <div class="legend" style="margin-top:10px">
      <span><span class="legend-dot" style="background:#5DCAA5"></span>収入</span>
      <span><span class="legend-dot" style="background:#F0997B"></span>支出</span>
    </div>
  </div>
  <nav class="nav">
    <button onclick="goTo('home')"><i class="ti ti-home"></i>ホーム</button>
    <button onclick="goTo('add')"><i class="ti ti-plus"></i>入力</button>
    <button class="active"><i class="ti ti-chart-bar"></i>グラフ</button>
  </nav>
</div>

</div>

<script>
const CLIENT_ID   = '650343401495-2j3a7klr8q4lrnkd4fai7a84f7v6n3ch.apps.googleusercontent.com';
const SHEET_ID    = '175jxK7Vr11RFD-z1F_ajTqdyGMARqwDS0be6fTtsL-c';
const SHEET_NAME  = 'records';
const SCOPES      = 'https://www.googleapis.com/auth/spreadsheets';

const EXPENSE_CATS = ['食費','交通費','日用品','外食','娯楽','医療','服飾','光熱費','通信費','その他'];
const INCOME_CATS  = ['給与','副業','ボーナス','その他収入'];
const CAT_COLORS   = ['#1D9E75','#378ADD','#D85A30','#D4537E','#7F77DD','#BA7517','#639922','#888780','#533AB7','#0F6E56'];
const CAT_ICONS    = {食費:'ti-shopping-cart',交通費:'ti-train',日用品:'ti-shopping-bag',外食:'ti-tools-kitchen-2',娯楽:'ti-confetti',医療:'ti-stethoscope',服飾:'ti-hanger',光熱費:'ti-bolt',通信費:'ti-wifi',その他:'ti-dots',給与:'ti-briefcase',副業:'ti-device-laptop',ボーナス:'ti-gift','その他収入':'ti-cash'};

let records = JSON.parse(localStorage.getItem('kk_records') || '[]');
let currentType = 'expense';
let viewYear, viewMonth;
let pieChart = null, barChart = null;
let accessToken = null;
let tokenClient = null;

(function initMonth(){
  const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth() + 1;
})();

function fmt(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function monthLabel(y,m){ return y + '年' + m + '月'; }

// ── Google Identity Services ──────────────────────────────
window.onload = function(){
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: () => {} });
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if(resp.error){ setSyncStatus('ログイン失敗'); return; }
      accessToken = resp.access_token;
      localStorage.setItem('kk_token', accessToken);
      goTo('home');
      await ensureSheet();
      await loadFromSheet();
    }
  });
  const saved = localStorage.getItem('kk_token');
  if(saved){ accessToken = saved; goTo('home'); ensureSheet().then(loadFromSheet); }
  else { goTo('login'); }
};

function signIn(){ tokenClient.requestAccessToken(); }
function signOut(){
  accessToken = null;
  localStorage.removeItem('kk_token');
  goTo('login');
}

// ── Sheets API helpers ────────────────────────────────────
async function sheetsRequest(method, endpoint, body){
  const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID + endpoint, {
    method, headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(res.status === 401){ accessToken = null; localStorage.removeItem('kk_token'); goTo('login'); throw new Error('auth'); }
  return res.json();
}

async function ensureSheet(){
  const meta = await sheetsRequest('GET', '?fields=sheets.properties.title');
  const exists = meta.sheets && meta.sheets.some(s => s.properties.title === SHEET_NAME);
  if(!exists){
    await sheetsRequest('POST', ':batchUpdate', {
      requests:[{ addSheet:{ properties:{ title: SHEET_NAME } } }]
    });
    // header row
    await sheetsRequest('PUT', '/values/' + SHEET_NAME + '!A1:F1?valueInputOption=RAW', {
      values:[['id','type','amount','cat','memo','date']]
    });
  }
}

async function loadFromSheet(){
  setSyncStatus('読み込み中...');
  document.getElementById('sync-btn').disabled = true;
  try {
    const res = await sheetsRequest('GET', '/values/' + SHEET_NAME + '!A2:F?majorDimension=ROWS');
    const rows = res.values || [];
    records = rows.filter(r => r[0]).map(r => ({
      id: Number(r[0]), type: r[1], amount: Number(r[2]), cat: r[3], memo: r[4]||'', date: r[5]
    }));
    records.sort((a,b) => b.id - a.id);
    localStorage.setItem('kk_records', JSON.stringify(records));
    setSyncStatus('同期済み ' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}));
    renderHome();
  } catch(e){ if(e.message !== 'auth') setSyncStatus('読み込み失敗'); }
  document.getElementById('sync-btn').disabled = false;
}

async function appendToSheet(rec){
  await sheetsRequest('POST', '/values/' + SHEET_NAME + '!A:F:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
    values:[[rec.id, rec.type, rec.amount, rec.cat, rec.memo, rec.date]]
  });
}

async function deleteFromSheet(id){
  // find row index
  const res = await sheetsRequest('GET', '/values/' + SHEET_NAME + '!A:A');
  const rows = res.values || [];
  const rowIdx = rows.findIndex(r => String(r[0]) === String(id));
  if(rowIdx < 0) return;
  const meta = await sheetsRequest('GET', '?fields=sheets.properties');
  const sheet = meta.sheets && meta.sheets.find(s => s.properties.title === SHEET_NAME);
  if(!sheet) return;
  const sheetId = sheet.properties.sheetId;
  await sheetsRequest('POST', ':batchUpdate', {
    requests:[{ deleteDimension:{ range:{ sheetId, dimension:'ROWS', startIndex: rowIdx, endIndex: rowIdx + 1 } } }]
  });
}

async function syncAll(){
  setSyncStatus('同期中...');
  document.getElementById('sync-btn').disabled = true;
  try {
    // overwrite all data
    await sheetsRequest('PUT', '/values/' + SHEET_NAME + '!A1:F1?valueInputOption=RAW', {
      values:[['id','type','amount','cat','memo','date']]
    });
    // clear old data rows
    await sheetsRequest('POST', '/values/' + SHEET_NAME + '!A2:F:clear', {});
    if(records.length > 0){
      const sorted = [...records].sort((a,b) => a.id - b.id);
      await sheetsRequest('POST', '/values/' + SHEET_NAME + '!A2:F:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
        values: sorted.map(r => [r.id, r.type, r.amount, r.cat, r.memo, r.date])
      });
    }
    setSyncStatus('同期済み ' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}));
  } catch(e){ if(e.message !== 'auth') setSyncStatus('同期失敗'); }
  document.getElementById('sync-btn').disabled = false;
}

function setSyncStatus(msg){ document.getElementById('sync-status').textContent = msg; }

// ── App logic ────────────────────────────────────────────
function goTo(s){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s-' + s).classList.add('active');
  if(s === 'home')  renderHome();
  if(s === 'chart') renderCharts();
}

function changeMonth(d){ viewMonth += d; if(viewMonth>12){viewMonth=1;viewYear++;} if(viewMonth<1){viewMonth=12;viewYear--;} renderHome(); }

function setType(t){
  currentType = t;
  document.getElementById('type-expense').classList.toggle('active', t === 'expense');
  document.getElementById('type-income').classList.toggle('active', t === 'income');
  populateCatSelect('inp-cat', t === 'expense' ? EXPENSE_CATS : INCOME_CATS);
}

function populateCatSelect(id, cats){
  const s = document.getElementById(id); s.innerHTML = '';
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; s.appendChild(o); });
}

function monthRecords(y,m){ return records.filter(r=>{ const[ry,rm]=r.date.split('-').map(Number); return ry===y&&rm===m; }); }

async function addRecord(){
  const amt = parseFloat(document.getElementById('inp-amount').value);
  if(!amt||amt<=0){ alert('金額を入力してください'); return; }
  const rec = { id: Date.now(), type: currentType, amount: amt, cat: document.getElementById('inp-cat').value, memo: document.getElementById('inp-memo').value.trim(), date: document.getElementById('inp-date').value || new Date().toISOString().slice(0,10) };
  records.unshift(rec);
  localStorage.setItem('kk_records', JSON.stringify(records));
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-memo').value = '';
  goTo('home');
  // async save to sheet
  if(accessToken){
    setSyncStatus('保存中...');
    document.getElementById('sync-btn').disabled = true;
    try { await appendToSheet(rec); setSyncStatus('同期済み ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})); }
    catch(e){ if(e.message!=='auth') setSyncStatus('保存失敗（手動同期してください）'); }
    document.getElementById('sync-btn').disabled = false;
  }
}

async function deleteRecord(id){
  if(!confirm('この記録を削除しますか？')) return;
  records = records.filter(r => r.id !== id);
  localStorage.setItem('kk_records', JSON.stringify(records));
  renderHome();
  if(accessToken){
    setSyncStatus('削除中...');
    try { await deleteFromSheet(id); setSyncStatus('同期済み ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})); }
    catch(e){ if(e.message!=='auth') setSyncStatus('削除失敗（手動同期してください）'); }
  }
}

function renderHome(){
  document.getElementById('home-month-lbl').textContent = monthLabel(viewYear, viewMonth);
  const recs = monthRecords(viewYear, viewMonth);
  let income = 0, expense = 0;
  recs.forEach(r => r.type === 'income' ? income += r.amount : expense += r.amount);
  document.getElementById('h-income').textContent  = fmt(income);
  document.getElementById('h-expense').textContent = fmt(expense);
  document.getElementById('h-balance').textContent = fmt(income - expense);
  const pct = income > 0 ? Math.min(100, Math.round(expense/income*100)) : 0;
  const fill = document.getElementById('h-pfill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 90 ? '#D85A30' : pct > 70 ? '#BA7517' : '#1D9E75';
  document.getElementById('h-pct-lbl').textContent = '収入に対する支出: ' + pct + '%';
  const list = document.getElementById('home-list'); list.innerHTML = '';
  if(recs.length === 0){ list.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  recs.forEach(r => {
    const isExp = r.type === 'expense';
    const ic = CAT_ICONS[r.cat] || 'ti-dots';
    const col = isExp ? 'var(--red-bg)' : 'var(--green-bg)';
    const icol= isExp ? 'var(--red-text)' : 'var(--green-text)';
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<div class="item-icon" style="background:${col}"><i class="ti ${ic}" style="color:${icol}"></i></div><div class="item-info"><div class="name">${r.cat}${r.memo?' — '+r.memo:''}</div><div class="date">${r.date}</div></div><div class="item-amount" style="color:${icol}">${isExp?'-':'+'}${fmt(r.amount)}</div><button class="del-btn" onclick="deleteRecord(${r.id})"><i class="ti ti-trash"></i></button>`;
    list.appendChild(d);
  });
}

function renderCharts(){
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth()+1;
  document.getElementById('chart-month-lbl').textContent = monthLabel(y,m);
  const recs = monthRecords(y,m);
  const catMap = {};
  recs.filter(r=>r.type==='expense').forEach(r=>catMap[r.cat]=(catMap[r.cat]||0)+r.amount);
  const cats = Object.keys(catMap), vals = cats.map(c=>catMap[c]), colors = cats.map((_,i)=>CAT_COLORS[i%CAT_COLORS.length]);
  if(pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pie-chart'),{ type:'doughnut', data:{labels:cats,datasets:[{data:vals,backgroundColor:colors,borderWidth:0}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}} });
  const legend = document.getElementById('pie-legend'); legend.innerHTML='';
  const total = vals.reduce((a,b)=>a+b,0);
  cats.forEach((c,i)=>{ const pct=total>0?Math.round(vals[i]/total*100):0; legend.innerHTML+=`<span><span class="legend-dot" style="background:${colors[i]}"></span>${c} ${pct}%</span>`; });
  const months=[],incArr=[],expArr=[];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const dy=d.getFullYear(),dm=d.getMonth()+1; months.push(dm+'月'); const mr=monthRecords(dy,dm); let inc=0,exp=0; mr.forEach(r=>r.type==='income'?inc+=r.amount:exp+=r.amount); incArr.push(inc);expArr.push(exp); }
  if(barChart) barChart.destroy();
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  barChart = new Chart(document.getElementById('bar-chart'),{ type:'bar', data:{labels:months,datasets:[{label:'収入',data:incArr,backgroundColor:'#5DCAA5',borderWidth:0},{label:'支出',data:expArr,backgroundColor:'#F0997B',borderWidth:0}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:isDark?'#888':'#999'}},y:{ticks:{callback:v=>v===0?'0':'¥'+(v/10000).toFixed(0)+'万',font:{size:10},color:isDark?'#888':'#999'},grid:{color:isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)'}}}} });
}

// init
document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);
populateCatSelect('inp-cat', EXPENSE_CATS);
</script>
